# Nginx config for a VPS. Replace yourstore.in with your domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/craftstore
#   sudo ln -s /etc/nginx/sites-available/craftstore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourstore.in -d www.yourstore.in -d api.yourstore.in

# Storefront: https://yourstore.in
server {
  listen 80;
  server_name yourstore.in www.yourstore.in;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Backend + admin: https://api.yourstore.in (admin at /app)
server {
  listen 80;
  server_name api.yourstore.in;
  client_max_body_size 20m; # product image uploads

  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
